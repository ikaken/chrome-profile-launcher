name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet publish -c Release -r win-x64 --self-contained false /p:PublishReadyToRun=true

      - name: Install Velopack
        run: dotnet tool install -g vpk

      - name: Package
        run: |
          vpk pack `
            --packId ChromeProfileLauncher `
            --packVersion ${{ github.ref_name }} `
            --packDir ./bin/Release/net10.0-windows/win-x64/publish `
            --outputDir ./releases

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: ./releases/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
